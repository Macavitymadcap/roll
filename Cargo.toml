[package]
name = "rust-roll"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A command-line dice roller for tabletop RPGs, following the D&D 5e rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Macavitymadcap/roll"
readme = "README.md"
keywords = ["dice", "rpg", "dnd", "tabletop", "cli"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "roll"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
regex = "1.13.1"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"